# for reviewers. kindnetd (kind's default CNI) doesnt enforce NetworkPolicy at all
# it just silently do nothing , so default CNI is off here and
# Makefile's kind-up target installs calico instead
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
networking:
  disableDefaultCNI: true
