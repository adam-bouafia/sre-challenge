# trimmed-down kube-prometheus-stack values as we are working on a single-node dev cluster
# helm install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f k8s/monitoring-values.yaml

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 800Mi
    # without these, prometheus only looks at ServiceMonitors/PrometheusRules
    # with this release's own helm label and ecorp's chart is a different
    # release, so its ServiceMonitor would just get ignored otherwise
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: true
