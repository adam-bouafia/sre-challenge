{{- if not .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ecorp.fullname" .) }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if not $secretKey }}
  {{- if and $existing $existing.data }}
    {{- $secretKey = index $existing.data "SECRET_KEY" | b64dec }}
  {{- else }}
    {{- $secretKey = randAlphaNum 64 }}
  {{- end }}
{{- end }}
{{- $adminPassword := .Values.secrets.adminPassword }}
{{- if not $adminPassword }}
  {{- if and $existing $existing.data }}
    {{- $adminPassword = index $existing.data "ADMIN_PASSWORD" | b64dec }}
  {{- else }}
    {{- $adminPassword = randAlphaNum 24 }}
  {{- end }}
{{- end }}
# helm re-renders every template from scratch on every upgrade, even ones
# that have nothing to do with secrets, BUMP the image tag and this would
# fire too. without the lookup below, randAlphaNum would generate a brand
# new secret_key + admin_password every single time, which signs everyone's
# session cookie out of existence and silently swaps the admin password.
# so: generated once on first install, then every later upgrade just reads
# the same value back off the live secret instead of making a new one

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecorp.fullname" . }}
  labels:
    {{- include "ecorp.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ $adminPassword | quote }}
{{- end }}
