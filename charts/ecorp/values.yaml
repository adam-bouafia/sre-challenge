image:
  repository: ghcr.io/adam-bouafia/sre-challenge-ecorp
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: ecorp.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

persistence:
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

# no real secrets in this file ever. either existingSecret pointing at
# something we made out of (kubectl create secret / sealed-secrets /
# external secrets), or --set secretKey=... / adminPassword=... at install time
secrets:
  existingSecret: ""
  secretKey: ""
  adminUsername: admin
  adminPassword: ""

env:
  sessionCookieSecure: "true"
  logLevel: INFO
  gunicornWorkers: "1"

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
    loginFailureThreshold: 10
  dashboard:
    enabled: false
