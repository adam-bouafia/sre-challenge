name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: ruff check
        working-directory: app
        run: ruff check .

      - name: ruff format --check
        working-directory: app
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: app
        run: pytest --cov=ecorp --cov-report=term-missing

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: bandit
        working-directory: app
        run: bandit -r ecorp -ll

      - name: pip-audit
        working-directory: app
        run: pip-audit -r requirements.txt

  docker-build:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.tags.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Save image for later jobs
        run: |
          docker save -o /tmp/ecorp-image.tar \
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_short }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecorp-image
          path: /tmp/ecorp-image.tar
          retention-days: 1

  image-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ecorp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/ecorp-image.tar

      - name: Trivy scan (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.sha_short }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  helm-validate:
    needs: image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/ecorp

      - name: helm template
        run: |
          helm template ecorp charts/ecorp \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set metrics.dashboard.enabled=true \
            > /tmp/ecorp-rendered.yaml

      - name: kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          ./kubeconform -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/ecorp-rendered.yaml

  push:
    needs: [docker-build, helm-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ecorp-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/ecorp-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.sha_short }}
          docker push ${{ env.IMAGE_NAME }}:latest
