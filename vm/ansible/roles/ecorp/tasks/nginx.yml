---
- name: Ensure the TLS directory exists
  ansible.builtin.file:
    path: "{{ ecorp_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Generate a self-signed TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 825
      -newkey rsa:2048
      -keyout {{ ecorp_tls_key }}
      -out {{ ecorp_tls_cert }}
      -subj "/CN={{ ecorp_server_name }}"
      -addext "subjectAltName=DNS:{{ ecorp_server_name }},DNS:localhost"
    creates: "{{ ecorp_tls_cert }}"
  notify: Reload nginx

- name: Deploy the shared reverse-proxy snippet
  ansible.builtin.template:
    src: proxy-common.conf.j2
    dest: /etc/nginx/snippets/proxy-common.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy the E-Corp nginx site
  ansible.builtin.template:
    src: ecorp.conf.j2
    dest: /etc/nginx/sites-available/ecorp.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the E-Corp nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ecorp.conf
    dest: /etc/nginx/sites-enabled/ecorp.conf
    state: link
  notify: Reload nginx

- name: Disable the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
