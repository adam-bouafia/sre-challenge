- name: Check for an existing secrets file
  ansible.builtin.stat:
    path: "{{ ecorp_env_file }}"
  register: ecorp_env_stat

- name: Slurp the existing secrets file, if any
  ansible.builtin.slurp:
    src: "{{ ecorp_env_file }}"
  register: ecorp_env_slurp
  when: ecorp_env_stat.stat.exists

- name: Reuse the existing secret key and admin password
  ansible.builtin.set_fact:
    ecorp_secret_key: >-
      {{ (ecorp_env_slurp.content | b64decode).splitlines()
      | select('match', '^SECRET_KEY=') | first
      | regex_replace('^SECRET_KEY=', '') }}
    ecorp_admin_password: >-
      {{ (ecorp_env_slurp.content | b64decode).splitlines()
      | select('match', '^ADMIN_PASSWORD=') | first
      | regex_replace('^ADMIN_PASSWORD=', '') }}
  when: ecorp_env_stat.stat.exists
  no_log: true

- name: Generate a secret key and admin password on first provision
  ansible.builtin.set_fact:
    ecorp_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null chars=hexdigits length=64') }}"
    ecorp_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=24') }}"
  when: not ecorp_env_stat.stat.exists
  no_log: true

- name: Write the secrets env file
  ansible.builtin.template:
    src: ecorp.env.j2
    dest: "{{ ecorp_env_file }}"
    owner: root
    group: ecorp
    mode: "0640"
  no_log: true
  notify: Restart ecorp

- name: Initialize the database schema and seed/update the admin user
  ansible.builtin.command:
    cmd: "{{ ecorp_venv_dir }}/bin/flask init-db"
  args:
    chdir: "{{ ecorp_app_dir }}"
  become: true
  become_user: ecorp
  environment:
    FLASK_APP: ecorp
    SECRET_KEY: "{{ ecorp_secret_key }}"
    DATABASE_PATH: "{{ ecorp_data_dir }}/ecorp.db"
    ADMIN_USERNAME: "{{ ecorp_admin_username }}"
    ADMIN_PASSWORD: "{{ ecorp_admin_password }}"
  no_log: true

  changed_when: false
