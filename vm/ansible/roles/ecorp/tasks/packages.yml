---
- name: Install required system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - rsync
      - nginx
      - ufw
      - openssl
      - sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the ecorp system user
  ansible.builtin.user:
    name: ecorp
    system: true
    shell: /usr/sbin/nologin
    home: /opt/ecorp
    create_home: true

- name: Create the ecorp data and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ecorp_data_dir }}", owner: ecorp, group: ecorp, mode: "0750" }
    - { path: "{{ ecorp_config_dir }}", owner: root, group: ecorp, mode: "0750" }
    - { path: "{{ ecorp_app_dir }}", owner: ecorp, group: ecorp, mode: "0750" }
