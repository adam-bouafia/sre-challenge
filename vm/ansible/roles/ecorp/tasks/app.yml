---
- name: Sync the app source to the VM  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >
      rsync --delay-updates -F --compress --delete-after --archive
      --no-owner --no-group --no-perms --chmod=Du=rwx,Dg=rx,Do=,Fu=rw,Fg=r,Fo=
      --rsh="ssh -i {{ ansible_ssh_private_key_file }} -o Port={{ ansible_port | default(22) }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      --rsync-path="sudo rsync"
      --exclude=.venv --exclude=__pycache__ --exclude=*.pyc --exclude=tests
      --exclude=.pytest_cache --exclude=.coverage --exclude=instance --exclude=*.db
      --exclude=requirements.in --exclude=requirements-dev.in --exclude=requirements-dev.txt
      --out-format="%i %n%L"
      {{ ecorp_app_src }}/ {{ ansible_user }}@{{ ansible_host }}:{{ ecorp_app_dir }}/
  delegate_to: localhost
  become: false
  register: ecorp_rsync
  changed_when: ecorp_rsync.stdout | trim != ""
  notify: Restart ecorp

- name: Fix ownership after sync (rsync writes as root via sudo)
  ansible.builtin.file:
    path: "{{ ecorp_app_dir }}"
    owner: ecorp
    group: ecorp
    recurse: true

- name: Install the app into a dedicated venv
  ansible.builtin.pip:
    requirements: "{{ ecorp_app_dir }}/requirements.txt"
    virtualenv: "{{ ecorp_venv_dir }}"
    virtualenv_command: python3 -m venv
  become: true
  become_user: ecorp
  notify: Restart ecorp
