apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecorp.fullname" . }}
  labels:
    {{- include "ecorp.labels" . | nindent 4 }}
spec:
  # Deployment basic Skelton (image, ports, env vars, volumes): https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#creating-a-deployment
  # 
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ecorp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecorp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ecorp.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: ecorp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "ecorp.secretName" . }}
          env:
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.env.sessionCookieSecure | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.env.gunicornWorkers | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ecorp.fullname" . }}-data
        - name: tmp
          emptyDir: {}
