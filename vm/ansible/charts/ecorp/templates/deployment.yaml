apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecorp.fullname" . }}
  labels:
    {{- include "ecorp.labels" . | nindent 4 }}
spec:

  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ecorp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecorp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ecorp.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ecorp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "ecorp.secretName" . }}
          env:
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.env.sessionCookieSecure | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.env.gunicornWorkers | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ecorp.fullname" . }}-data
        - name: tmp
          emptyDir: {}
